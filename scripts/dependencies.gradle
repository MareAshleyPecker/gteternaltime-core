
dependencies {
    implementation group: 'javax.annotation', name: 'javax.annotation-api', version: '1.3.2'

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'  // mixin

    //ae2
    implementation fg.deobf("curse.maven:guideme-1173950:8204776")//guideme-20.1.15-forge
    implementation fg.deobf("curse.maven:applied-energistics-2-223794:7148487")//ae2-15.4.10-forge

    //gtceu
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${mc_version}:${gtm_version}")

    // configuration（dev.toma）—— 配置库，GTCEu 用 JarJar 自带
    // jar 从 GTCEu 的 META-INF/jarjar/ 里提取到 libs/，运行时由 GTCEu 提供，这里只用于编译
    // 注意：本 mod 的配置已改走 ForgeConfigSpec，编译期不再 import 这套库；
    //      保留依赖是为了随时按 GTETConfig.java.bak / ConfigLangRegistry.java.bak 切回旧实现
    compileOnly files("libs/configuration-forge-${mc_version}-${configuration_version}.jar")

    implementation fg.deobf("curse.maven:ldlib-626676:7809449")//ldlib-1.20.1-1.0.50-forge

    //architectury (ftb 依赖)
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")//architectury-9.2.14-forge

    //ftb
    implementation fg.deobf("curse.maven:ftb-library-forge-404465:8226927")
    implementation fg.deobf("curse.maven:ftb-quests-forge-289412:8078538")
    implementation fg.deobf("curse.maven:ftb-essentials-410811:7609948")
    implementation fg.deobf("curse.maven:ftb-ultimine-forge-386134:7880472")
    implementation fg.deobf("curse.maven:ftb-teams-forge-404468:7499810")//ftb-teams-2001.3.2-forge

    // Kotlin for Forge
    implementation fg.deobf("thedarkcolour:kotlinforforge:4.12.0")

    compileOnly "dev:Registrate:MC1.20-1.3.11"

    runtimeOnly fg.deobf("dev:configured-forge-1.20.1:2.2.3")

    compileOnly(fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}"))
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")
    runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    //jade
    implementation fg.deobf("curse.maven:jade-324717:8479276")
    implementation fg.deobf("curse.maven:jade-addons-583345:8203724")

    //embeddium
    implementation fg.deobf("curse.maven:embeddium-908741:5681725")

    //创世神（WorldEdit + WorldEditCUI）—— **仅本机 dev 运行时**：只用来在开发环境里跑，
    //不参与编译、也不进产物（jar 任务只内嵌 GTM，见 build.gradle 的 JarJar 段）。
    //⚠️ 两个 jar 都不入库（见 .gitignore 的 /libs/worldedit-*.jar 与 /libs/WorldEditCUI-*.jar）：
    //    WorldEdit 是 GPL-3.0，随仓库分发会带许可证问题，而且体积大。
    //   ⇒ 这里按「jar 在不在」决定要不要加依赖，**别人克隆下来缺这两个 jar 时照样能构建**。
    if (file("libs/worldedit-7.2.15.jar").exists()) {
        runtimeOnly fg.deobf("dev:worldedit:7.2.15")
    }
    if (file("libs/WorldEditCUI-1.20.1.jar").exists()) {
        runtimeOnly fg.deobf("dev:WorldEditCUI:1.20.1")
    }
}
