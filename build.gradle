import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

// ================================================================
//  buildscript 和 plugins 块必须在主 build.gradle 中，无法拆分
// ================================================================

buildscript {
    repositories {

        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }  // mixin
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'  // mixin
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
    id 'io.freefair.lombok' version '8.6'
}

// ================================================================
//  以下模块已拆分至 scripts/ 目录
// ================================================================

apply from: 'scripts/project.gradle'        // group, version, base, java, sourceSets
apply from: 'scripts/minecraft.gradle'      // minecraft 映射与运行配置
apply from: 'scripts/mixin.gradle'          // Mixin 插件与配置
apply from: 'scripts/repositories.gradle'   // 依赖仓库
apply from: 'scripts/dependencies.gradle'   // 项目依赖
apply plugin: 'org.spongepowered.mixin'


tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ================================================================
//  JarJar 内嵌 —— 仅打包阶段运行，提取修改过的 GTM class 嵌入 JAR
// ================================================================

def modifiedGtmClasses = [
    'com/gregtechceu/gtceu/api/machine/multiblock/MultiblockControllerMachine',
    'com/gregtechceu/gtceu/api/machine/feature/multiblock/IMultiController',
    'com/gregtechceu/gtceu/api/pattern/MultiblockState',
    'com/gregtechceu/gtceu/api/pattern/MultiblockWorldSavedData',
    'com/gregtechceu/gtceu/api/pattern/BlockPattern',
    'com/gregtechceu/gtceu/api/pattern/util/RelativeDirection',
    'com/gregtechceu/gtceu/common/machine/multiblock/electric/CentralMonitorMachine',
]

def patchJarName = "gtceu-optimized-${gtm_version}.jar"
def mavenLocalDir = "${System.properties['user.home']}/.m2/repository/com/gregtechceu/gtceu/gtceu-${mc_version}/${gtm_version}"
def gtmJarFile = file("${mavenLocalDir}/gtceu-${mc_version}-${gtm_version}.jar")
def patchDir = layout.buildDirectory.dir("jarjarPatch")

// 从 mavenLocal 的 GTM jar 提取修改过的 class 并打包
tasks.register('createGtmPatchJar', Jar) {
    archiveFileName = patchJarName
    destinationDirectory = patchDir.get()
    from(zipTree(gtmJarFile)) {
        modifiedGtmClasses.each { base ->
            include "${base}.class"
            include "${base}\$*.class"  // 内部类
        }
    }
    // 只在该任务实际运行时才要求源 jar 存在
    onlyIf { gtmJarFile.exists() }
}

// 将 patch jar 嵌入主 jar 的 META-INF/jarjar/
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "ContainedDeps"           : patchJarName])
    }

    // 在打包时引入 patch jar 到 jarjar 目录
    from(patchDir.get()) {
        include "${patchJarName}"
        into 'META-INF/jarjar'
    }

    finalizedBy 'reobfJar'
}

// 打包前先生成 patch jar
tasks.named('jar').configure { dependsOn('createGtmPatchJar') }

// Java 编译使用 UTF-8 编码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Kotlin 编译目标 JVM 17（与 Java toolchain 一致）
tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

// ═══ 便捷任务：data gen → client ═══
tasks.register('runDataAndClient') {
    group = 'forge'
    dependsOn 'runData'
    finalizedBy 'runClient'
}

