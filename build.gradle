import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

// ================================================================
//  buildscript 和 plugins 块必须在主 build.gradle 中，无法拆分
// ================================================================

buildscript {
    repositories {

        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }  // mixin
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'  // mixin
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
    id 'io.freefair.lombok' version '8.6'
}

// ================================================================
//  以下模块已拆分至 scripts/ 目录
// ================================================================

apply from: 'scripts/project.gradle'        // group, version, base, java, sourceSets
apply from: 'scripts/minecraft.gradle'      // minecraft 映射与运行配置
apply from: 'scripts/mixin.gradle'          // Mixin 插件与配置
apply from: 'scripts/repositories.gradle'   // 依赖仓库
apply from: 'scripts/dependencies.gradle'   // 项目依赖
apply from: 'scripts/patches.gradle'        // 补丁 jar 的自动构建/校验（写死外部路径 + jarjar* 属性）
apply plugin: 'org.spongepowered.mixin'


tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ================================================================
//  JarJar 内嵌 —— 打包时把**对应版本**的 GTM 直接塞进本 mod
//
//  ⚠️ 版本**写死**（不走依赖解析）：升级时改 scripts/patches.gradle 的版本常量，
//     并**同时**改 gradle.properties 的 gtm_version，
//     否则编译用的版本与随包分发的版本会对不上。
//  ⚠️ 内嵌的 jar 取 patchJar/ 里那份**本地打过补丁**的产物（异步结构检测等改动就在里面），不是官方原件；
//     它的**自动构建/校验**都在 scripts/patches.gradle：
//     产物缺失时 gradlew build / jar 会自动去外部检出构建，产物已在就秒过（-PgtetPatchBuild=true 强制重建，
//     -PgtetSkipPatchBuild=true 强制跳过）。
//  ⚠️ 内嵌 = 无条件加载（ContainedDeps 是 JarJar 的老机制）：整合包里**不要**再单独放 GTM，
//     否则同一个 mod 会出现两份。
// ================================================================

// 写死的嵌入版本与固定文件名（jar 内的名字必须稳定，ContainedDeps 按它找文件）
// ⚠️ 这里的 jarjarGtmVersion / jarjarGtmName / jarjarGtmJar 全部由 scripts/patches.gradle 定义
//     （那里还有自动构建它们的任务），**不要**在这里再写一份。
//     GTM：patchJar/maven/com/gregtechceu/gtceu/gtceu-1.20.1/7.5.3/gtceu-1.20.1-7.5.3.jar
//          （与 gradle.properties 的 gtm_version 必须一致）

def jarjarDir = layout.buildDirectory.dir("jarjar")

// 收集要内嵌的 jar（统一改名成上面写死的固定文件名）
// ⚠️ 必须是 Sync 而不是 Copy：Copy 不会清掉目标目录里本次不再产出的旧文件，
//    于是历史上内嵌过、现在已移除的 jar 会一直留在中间目录里被 jar 任务全量打进包
//    （发生过一次：manifest 的 ContainedDeps 已去掉某项，包里却仍带着那个 jar）。
tasks.register('collectJarjarDeps', Sync) {
    // 缺补丁 jar 就在这里自动去外部检出构建；已有产物则那个任务自己 SKIPPED（快路径）
    dependsOn 'buildPatchedGtm'

    into jarjarDir

    // ⚠️ 源必须**执行期**才解析：补丁 jar 很可能是本次构建刚由 buildPatchedGtm 产出的，
    //    配置期用 exists() 判断会拿到过期结果、把官方原件嵌进去。
    from(providers.provider { jarjarGtmJar.isFile() ? [jarjarGtmJar] : [] }) { rename { jarjarGtmName } }

    doFirst {
        def problems = jarjarPatchProblems()
        if (!problems.isEmpty()) {
            problems.each { logger.warn('[gtetcore] {}', it) }
            if (!jarjarGtmJar.isFile()) {
                logger.warn('[gtetcore] 本次不会内嵌 GTM。要补丁版：装好 GTM 补丁检出后跑 gradlew buildPatchedGtm（位置可用 -PgtmRepo= 指定）')
            }
            logger.warn('[gtetcore] 只想跳过外部构建：-PgtetSkipPatchBuild=true；想强制重建：-PgtetPatchBuild=true')
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "ContainedDeps"           : "${jarjarGtmName}"])
    }

    // 把收集好的 jar 放进 META-INF/jarjar/
    from(jarjarDir) {
        include '*.jar'
        into 'META-INF/jarjar'
    }

    finalizedBy 'reobfJar'
}

// 打包前先收集内嵌 jar
tasks.named('jar').configure { dependsOn('collectJarjarDeps') }

// Java 编译使用 UTF-8 编码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Kotlin 编译目标 JVM 17（与 Java toolchain 一致）
tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

// ═══ 便捷任务：data gen → client ═══
tasks.register('runDataAndClient') {
    group = 'forge'
    dependsOn 'runData'
    finalizedBy 'runClient'
}

