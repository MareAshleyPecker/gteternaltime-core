# ---- 内存相关：提交上限 = 16G 物理 + D:\pagefile.sys（初始 19G / 上限 20G）≈ 34.4G，实测可用 ~16G。
#      以前页面文件在 C 盘、上限 10G 且峰值顶满，这里每一项都在「压已提交内存」；
#      扩容后不再需要压得那么狠，下面几条保留的是习惯性卫生，不是硬约束 ----
# -Xms128m    不必一启动就 commit 大堆（errno 1455 那次 mmap 的正是默认的物理/64 ≈ 254MiB）
# MaxMetaspaceSize / ReservedCodeCacheSize / CompressedClassSpaceSize  默认分别是 无上限 / 240m / 1G，全是只增不减的 commit
# +UseSerialGC  构建堆 ≤2G 时 SerialGC 的 native 开销（card table、remembered set、每核一个 GC 线程栈）比 G1 小
# Min/MaxHeapFreeRatio  让空闲堆能还给系统
# ⚠️ 命令行再传 -Dorg.gradle.jvmargs=... 会**整体覆盖**这一行（不是追加），要改就改这里
org.gradle.jvmargs=-Xms128m -Xmx2g -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:CompressedClassSpaceSize=128m -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20
org.gradle.daemon=false
# 构建期并发 JVM 数钉死为 1：ForgeGradle 的反编译/下载任务最容易在这里起出多余 worker 进程
org.gradle.workers.max=1
# 关掉文件系统监视（native 缓冲 + 常驻线程）
org.gradle.vfs.watch=false
# Kotlin 编译走进程内：省掉**一整个** Kotlin 编译器 JVM。
# ⚠️ 实测：不带这一条时构建会留下一个 commit ≈ 594MB 的 kotlin 守护进程，而且 gradlew --stop **杀不掉它**
kotlin.compiler.execution.strategy=in-process
# 万一有会话覆盖了上面的策略，这条兜底（默认 -Xmx512M 偏大）
kotlin.daemon.jvmargs=-Xmx256M -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=96m

